name: Build GDScript Compiler ELF

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    name: Build ${{ matrix.elf }}
    strategy:
      matrix:
        include:
          - elf: gdscript.elf
            double_precision: OFF
            variant_size: 24
            artifact: godot-sandbox-gdscript-elf
          # A double-precision host refuses a guest whose Variant is not 40 bytes.
          - elf: gdscript.double.elf
            double_precision: ON
            variant_size: 40
            artifact: godot-sandbox-gdscript-double-elf

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install RISC-V cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu cmake

      - name: Configure
        env:
          CC: riscv64-linux-gnu-gcc-14
          CXX: riscv64-linux-gnu-g++-14
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/tests/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DSTRIPPED=ON \
            -DDOUBLE_PRECISION=${{ matrix.double_precision }} \
            -S program/cpp/gdscript_compiler

      - name: Build
        run: cmake --build build --parallel 4

      - name: Rename artifact
        run: mv build/gdscript build/${{ matrix.elf }}

      - name: Verify ELF
        run: |
          file build/${{ matrix.elf }}
          riscv64-linux-gnu-objcopy -O binary --only-section=.sandbox_variant build/${{ matrix.elf }} variant.bin
          python3 - variant.bin ${{ matrix.variant_size }} <<'EOF'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          if data[:4] != b"SBXV":
              sys.exit(f"no .sandbox_variant marker: {data[:8]!r}")
          size = struct.unpack("<I", data[4:8])[0]
          print(f".sandbox_variant: {size}-byte Variant")
          if size != int(sys.argv[2]):
              sys.exit(f"expected a {sys.argv[2]}-byte Variant")
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.elf }}
          if-no-files-found: error
