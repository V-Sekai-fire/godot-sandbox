name: Unit Tests

# Pull requests and pushes build the extension and fail on a compiler warning in src/.
# The GUT and .sgd runner tests run on a release tag or by hand.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake

      - name: Configure
        run: cmake -B ${{github.workspace}}/.build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          set -o pipefail
          cmake --build ${{github.workspace}}/.build --parallel 6 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Warnings in src/
        run: |
          own() { grep -E "^$GITHUB_WORKSPACE/src/[^:]+:[0-9]+:[0-9]+: warning:" "$@"; }
          echo "$GITHUB_WORKSPACE/src/control.cpp:1:1: warning: planted" > "$RUNNER_TEMP/control.log"
          own "$RUNNER_TEMP/control.log" > /dev/null || { echo "control: a planted warning was not found"; exit 1; }
          echo "$(grep -c ': warning:' "$RUNNER_TEMP/build.log") warnings in the build, vendored included"
          if own "$RUNNER_TEMP/build.log"; then exit 1; fi

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    # A healthy run is ~15 minutes. Anything far past that is a hung guest or a
    # Sandbox that lost its shared execute segment, not slow tests: fail instead
    # of burning hours on the runner.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{github.workspace}}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu cmake

      - name: Configure
        run: cmake -B ${{github.workspace}}/.build -DCMAKE_BUILD_TYPE=Debug

      - name: Build the unittests
        run: cmake --build ${{github.workspace}}/.build --parallel 6

      - name: Download and extract Godot
        working-directory: ${{github.workspace}}/tests
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip

      - name: Run Gut tests (RISC-V GNU toolchain)
        working-directory: ${{github.workspace}}/tests
        run: |
          # Run the tests
          CI=1 GODOT=./Godot_v4.6.3-stable_linux.x86_64 ./run_unittests.sh

      - name: Run the headless .sgd test runner
        working-directory: ${{github.workspace}}/tests
        run: |
          # The documented CI path for @test: the same runner a project ships.
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            -s addons/godot_sandbox/run_sgd_tests.gd -- tests/sgd_tests_sample.sgd

      - name: Run Gut tests (Zig)
        working-directory: ${{github.workspace}}/tests
        run: |
          # Download and install Zig
          wget -q https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            -O "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          export PATH=$RUNNER_TEMP/zig:$PATH

          # Run the tests with Zig
          CI=1 GODOT=./Godot_v4.6.3-stable_linux.x86_64 ./zig_unittests.sh
