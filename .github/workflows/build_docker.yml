name: Docker Builds
on:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io


jobs:
  godot:
    runs-on: "ubuntu-latest"
    name: Build Dockers
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: cpp
          - compiler: rust
          - compiler: zig
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase image name, and github.repository_owner keeps
      # the org's own casing, so a fork under a capitalised org fails the push.
      - name: Lowercase the owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          registry: ${{ env.REGISTRY }}
          context: program/${{ matrix.compiler }}/docker
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.compiler }}_compiler:latest
