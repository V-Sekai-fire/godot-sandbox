name: nix
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  breaker:
    runs-on: ubuntu-24.04
    outputs:
      closed: ${{ steps.breaker.outputs.closed }}
    steps:
      - id: breaker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nix.yml \
            --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --status completed --limit 20 \
            --json conclusion --jq '[.[]|select(.conclusion=="success" or .conclusion=="failure")][0:3]
              |map(select(.conclusion=="failure"))|length')
          if [ "$failed" -ge 3 ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo closed=false >> "$GITHUB_OUTPUT"
            echo "Circuit open: the last 3 builds on this branch failed. Run nix by hand after a fix." >> "$GITHUB_STEP_SUMMARY"
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          else
            echo closed=true >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: breaker
    if: needs.breaker.outputs.closed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --no-build
      - run: nix build .#addon -L --out-link addon
      - if: github.event_name == 'push'
        uses: oras-project/setup-oras@v1
      - if: github.event_name == 'push'
        run: |
          set -eu
          tag="v0.0.0-$(date -u -d @"$(git show -s --format=%ct)" +%Y%m%d%H%M%S)-${GITHUB_SHA:0:12}"
          mkdir out
          cp -rL addon/addons out/
          cd out
          find addons -type f | sort | xargs sha256sum > SHA256SUMS
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(oras push "ghcr.io/v-sekai-fire/godot-sandbox:$tag" \
            --artifact-type application/vnd.v-sekai.godot-sandbox.addon \
            addons SHA256SUMS --format go-template='{{.digest}}')
          echo "oras pull ghcr.io/v-sekai-fire/godot-sandbox@$digest ($tag)" >> "$GITHUB_STEP_SUMMARY"
